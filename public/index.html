<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 웹앱 프로토타입 빌더</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
</head>
<body class="h-screen flex bg-gray-100 overflow-hidden font-sans">

  <!-- 좌측: 대화 및 프롬프트 입력 창 -->
  <div class="w-1/3 flex flex-col border-r bg-white shadow-lg">
    <div class="p-4 bg-indigo-600 text-white font-bold text-lg flex items-center justify-between">
      <span>🚀 AI 웹앱 빌더</span>
      <span class="text-xs bg-indigo-700 px-2 py-1 rounded">수행평가용</span>
    </div>
    
    <div id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
      <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-lg text-indigo-900">
        💡 <b>반갑습니다!</b><br>
        불편함을 해결하기 위해 기획한 웹앱의 <b>목적과 주요 기능</b>을 설명해 주세요.<br>
        (예: "단어를 외우면 카드가 뒤집히는 영단어 오답노트 앱 만들어줘")
      </div>
    </div>

    <div class="p-4 border-t bg-gray-50 flex flex-col gap-2">
      <div class="flex gap-2">
        <input type="text" id="userInput" placeholder="요구사항 또는 수정사항 입력..." 
               class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
               onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()" 
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
          전송
        </button>
      </div>
    </div>
  </div>

  <!-- 우측: 실시간 미리보기 화면 -->
  <div class="w-2/3 flex flex-col bg-gray-200">
    <div class="p-2 px-4 bg-gray-300 text-xs font-semibold text-gray-700 flex justify-between items-center">
      <span>🖥️ 실시간 미리보기 (Preview)</span>
      <span id="status" class="bg-gray-400 text-white px-2 py-0.5 rounded text-[10px]">대기 중</span>
    </div>
    <iframe id="previewFrame" sandbox="allow-scripts" class="w-full flex-1 bg-white border-0"></iframe>
  </div>

  <script>
    const conversationHistory = [];

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      const status = document.getElementById('status');
      const sendBtn = document.getElementById('sendBtn');

      // 사용자 메시지 표시
      chatBox.innerHTML += `<div class="bg-blue-50 border border-blue-200 p-3 rounded-lg text-blue-900 ml-4"><b>나:</b> ${escapeHtml(text)}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      conversationHistory.push({ role: "user", content: text });
      status.innerText = "생성 중...";
      status.className = "bg-yellow-500 text-white px-2 py-0.5 rounded text-[10px]";
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: conversationHistory })
        });

        const data = await res.json();
        if (data.html) {
          // 마크다운 백틱 제거 보완
          let cleanHtml = data.html.replace(/^
```html/i, '').replace(/^```/i, '').replace(/```$/i, '');
          
          // iframe에 렌더링
          document.getElementById('previewFrame').srcdoc = cleanHtml;
          
          // AI 대화 히스토리 저장
          conversationHistory.push({ role: "assistant", content: cleanHtml });
          chatBox.innerHTML += `<div class="bg-green-50 border border-green-200 p-3 rounded-lg text-green-900">✅ 웹앱이 생성/수정되었습니다! 오른쪽 화면에서 직접 테스트해 보세요.</div>`;
        } else {
          chatBox.innerHTML += `<div class="bg-red-50 border border-red-200 p-3 rounded-lg text-red-900">오류: ${data.error}</div>`;
        }
      } catch (err) {
        chatBox.innerHTML += `<div class="bg-red-50 border border-red-200 p-3 rounded-lg text-red-900">서버 통신 오류가 발생했습니다.</div>`;
      } finally {
        status.innerText = "완료";
        status.className = "bg-green-600 text-white px-2 py-0.5 rounded text-[10px]";
        sendBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
