<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 웹앱 개발 실습 및 기획 빌더</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #FAF9F5;
      color: #141413;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .serif { font-family: 'Noto Serif KR', Georgia, serif; }

    /* Login Modal */
    #loginModal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(20, 20, 19, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: #FAF9F5;
      border: 1px solid #C6C4BA;
      border-radius: 8px;
      padding: 32px;
      width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    header {
      height: 60px;
      border-bottom: 1px solid #C6C4BA;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #FAF9F5;
      flex-shrink: 0;
    }
    .badge {
      background-color: #E3DACC;
      color: #141413;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .user-info {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Main Container (2-Column Grid) */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 490px 1fr;
      gap: 24px;
      max-width: 1700px;
      width: 100%;
      margin: 0 auto;
      height: calc(100vh - 60px);
      padding: 16px 32px;
    }

    /* Left Panel */
    .left-panel {
      background: #FAF9F5;
      border: 1px solid #C6C4BA;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .tab-bar {
      display: flex;
      border-bottom: 1px solid #C6C4BA;
      background-color: #E3DACC;
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 6px;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 600;
      color: #73726C;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #141413;
      border-bottom: 2px solid #D97757;
      background-color: #FAF9F5;
    }

    /* Content Area */
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: none;
    }
    .tab-content.active {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-section-title {
      font-size: 13px;
      font-weight: 700;
      color: #D97757;
      margin-top: 4px;
      padding-bottom: 4px;
      border-bottom: 1px solid #E3DACC;
    }
    label { font-size: 12px; font-weight: 600; color: #141413; }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      background: #FAF9F5;
      border: 1px solid #C6C4BA;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      color: #141413;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #D97757; }
    textarea { resize: vertical; }

    /* Buttons */
    .btn-primary {
      background-color: #141413;
      color: #FAF9F5;
      border: 1px solid #141413;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-primary:hover { background-color: #0F0F0E; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-secondary {
      background-color: #FAF9F5;
      color: #141413;
      border: 1px solid #C6C4BA;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background-color: #E3DACC; border-color: #141413; }

    .btn-danger {
      background-color: #FAF9F5;
      color: #C6613F;
      border: 1px solid #C6613F;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-danger:hover { background-color: #EBCECE; }

    /* Chat Messages */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      max-width: 94%;
      word-break: break-word;
    }
    .msg.system { background-color: #E3DACC; border: 1px solid #C6C4BA; }
    .msg.user { background-color: #141413; color: #FAF9F5; align-self: flex-end; }
    .msg.ai { background-color: #FAF9F5; border: 1px solid #C6C4BA; align-self: flex-start; }
    .refine-box {
      border-top: 1px solid #C6C4BA;
      padding-top: 10px;
      display: flex;
      gap: 8px;
    }

    /* Right Preview Panel */
    .preview-panel {
      background: #FAF9F5;
      border: 1px solid #C6C4BA;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .preview-bar {
      padding: 10px 16px;
      border-bottom: 1px solid #C6C4BA;
      background-color: #E3DACC;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .preview-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-indicator {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      background-color: #C6C4BA;
      font-weight: 600;
    }
    .status-indicator.running { background-color: #D97757; color: #FAF9F5; }
    iframe { flex: 1; width: 100%; height: 100%; border: none; background-color: #FFFFFF; }
    .code-viewer {
      flex: 1;
      width: 100%;
      background-color: #141413;
      color: #FAF9F5;
      border-radius: 6px;
      padding: 14px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.5;
      border: none;
      resize: none;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- 간이 로그인 모달 -->
  <div id="loginModal">
    <div class="modal-card">
      <h2 class="serif" style="font-size: 18px; font-weight: 700;">👤 학생 로그인 / 등록</h2>
      <p style="font-size: 12px; color: #73726C;">
        학번과 이름을 등록하면 작성 중인 기획서와 코드가 브라우저에 자동 저장되어 언제든 다시 불러올 수 있습니다.
      </p>
      <div class="form-group">
        <label>학번-이름 (아이디)</label>
        <input type="text" id="authId" placeholder="예: 20101홍길동">
      </div>
      <div class="form-group">
        <label>비밀번호 (자유 설정)</label>
        <input type="password" id="authPw" placeholder="비밀번호 입력">
      </div>
      <button class="btn-primary" onclick="handleAuth()">접속 및 작업 시작</button>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div style="display: flex; align-items: center; gap: 12px;">
      <h1 class="serif" style="font-size: 18px; font-weight: 700;">AI 웹앱 개발 수행평가 빌더</h1>
      <span class="badge">기획 ➔ 프로토타입 ➔ 버전 복원</span>
    </div>
    <div class="user-info">
      <span id="currentUserDisplay" style="font-weight: 600;">로그인 필요</span>
      <button class="btn-secondary" onclick="logout()">로그아웃</button>
    </div>
  </header>

  <!-- Main Grid -->
  <main>
    <!-- Left Panel -->
    <section class="left-panel">
      <nav class="tab-bar">
        <button id="tabPlanBtn" class="tab-btn active" onclick="switchTab('plan')">📝 1. 기획서</button>
        <button id="tabChatBtn" class="tab-btn" onclick="switchTab('chat')">🔄 2. 수정·개선</button>
        <button id="tabCodeBtn" class="tab-btn" onclick="switchTab('code')">💻 3. 코드 복사</button>
      </nav>

      <!-- 1. 기획서 탭 -->
      <div id="planContent" class="tab-content active">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div class="form-section-title" style="margin: 0;">1. 문제 발견 및 정의</div>
          <button class="btn-danger" onclick="resetAllData()">🗑️ 전체 초기화(리셋)</button>
        </div>

        <div class="form-group">
          <label>일상 속 불편한 점 *</label>
          <input type="text" id="p_problem" placeholder="예: 매일 쓴 용돈을 메모하면 합계 계산이 안 됨" oninput="saveCurrentState()">
        </div>
        <div class="form-group">
          <label>사용자 (Target User) *</label>
          <input type="text" id="p_target" placeholder="예: 용돈을 아껴 쓰고 싶은 학생" oninput="saveCurrentState()">
        </div>
        <div class="form-group">
          <label>해결 목표 *</label>
          <input type="text" id="p_goal" placeholder="예: 지출 입력 즉시 잔여 예산과 총액을 계산해 보여줌" oninput="saveCurrentState()">
        </div>

        <div class="form-section-title">2. 웹앱 개요 및 기능 설계</div>
        <div class="form-group">
          <label>웹앱 이름 *</label>
          <input type="text" id="p_name" placeholder="예: 내 돈을 지켜라" oninput="saveCurrentState()">
        </div>
        <div class="form-group">
          <label>주요 기능 목록 *</label>
          <textarea id="p_features" rows="2" placeholder="1) 예산 설정 및 잔액 계산 2) 금액 버튼 클릭 시 즉시 차감 3) 내역 표시" oninput="saveCurrentState()"></textarea>
        </div>

        <div class="form-section-title">3. 최초 AI 생성 요청문</div>
        <div class="form-group">
          <label>프롬프트 *</label>
          <textarea id="p_prompt" rows="2" placeholder="예: 상단에 예산과 잔액이 보이고, 간편 금액 추가 버튼을 누르면 잔액이 바로 차감되는 가계부 앱 만들어줘." oninput="saveCurrentState()"></textarea>
        </div>

        <button id="buildBtn" class="btn-primary" onclick="generateFromPlan()">🚀 프로토타입 생성하기</button>
      </div>

      <!-- 2. 대화 탭 -->
      <div id="chatContent" class="tab-content">
        <div id="chatBox" class="chat-messages">
          <div class="msg system">
            💡 프로토타입을 테스트해보고, 수정하고 싶은 부분을 아래에 입력해 주세요.<br>
            수정 후 버튼이 먹통이 되면 상단의 <b>[⏪ 이전 정상 버전 복원]</b> 버튼을 누르세요.
          </div>
        </div>
        
        <div class="refine-box">
          <textarea id="refineInput" rows="2" placeholder="수정 요청사항 입력 (Enter 전송)..."></textarea>
          <button id="refineBtn" class="btn-primary" style="padding: 0 16px;" onclick="sendRefinement()">수정</button>
        </div>
      </div>

      <!-- 3. 코드 복사 탭 -->
      <div id="codeContent" class="tab-content">
        <div style="display: flex; gap: 8px;">
          <button class="btn-secondary" onclick="copyCodeToClipboard()">📋 전체 코드 복사</button>
          <button class="btn-secondary" onclick="downloadHtmlFile()">💾 HTML 파일 다운로드</button>
        </div>
        <textarea id="codeDisplayArea" class="code-viewer" readonly placeholder="프로토타입이 생성되면 여기에 전체 코드가 표시됩니다."></textarea>
      </div>
    </section>

    <!-- Right Preview Screen -->
    <section class="preview-panel">
      <div class="preview-bar">
        <span class="serif" style="font-weight: 600; font-size: 14px;">🖥️ 실시간 프로토타입 화면</span>
        <div class="preview-actions">
          <button id="rollbackBtn" class="btn-secondary" onclick="rollbackToPreviousVersion()" title="수정 후 버튼이 안 먹힐 때 클릭">
            ⏪ 이전 정상 버전 복원
          </button>
          <span id="statusTag" class="status-indicator">작성 대기 중</span>
        </div>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-forms allow-modals allow-same-origin"></iframe>
    </section>
  </main>

  <script>
    let currentUser = null;
    let currentHtmlCode = "";
    let codeHistory = [];
    let chatLog = [];
    let timerInterval = null;

    function handleAuth() {
      const id = document.getElementById('authId').value.trim();
      const pw = document.getElementById('authPw').value.trim();

      if (!id || !pw) {
        alert('학번-이름과 비밀번호를 모두 입력하세요.');
        return;
      }

      const storedUser = localStorage.getItem(`user_${id}`);
      if (storedUser) {
        const parsed = JSON.parse(storedUser);
        if (parsed.pw !== pw) {
          alert('비밀번호가 일치하지 않습니다.');
          return;
        }
      } else {
        localStorage.setItem(`user_${id}`, JSON.stringify({ pw }));
      }

      currentUser = id;
      document.getElementById('currentUserDisplay').innerText = `👤 ${id}`;
      document.getElementById('loginModal').style.display = 'none';

      loadUserData();
    }

    function logout() {
      if (confirm('로그아웃 하시겠습니까?')) {
        currentUser = null;
        document.getElementById('loginModal').style.display = 'flex';
      }
    }

    function saveCurrentState() {
      if (!currentUser) return;

      const state = {
        problem: document.getElementById('p_problem').value,
        target: document.getElementById('p_target').value,
        goal: document.getElementById('p_goal').value,
        name: document.getElementById('p_name').value,
        features: document.getElementById('p_features').value,
        prompt: document.getElementById('p_prompt').value,
        html: currentHtmlCode,
        history: codeHistory,
        chat: chatLog
      };

      localStorage.setItem(`data_${currentUser}`, JSON.stringify(state));
    }

    function loadUserData() {
      if (!currentUser) return;

      const raw = localStorage.getItem(`data_${currentUser}`);
      if (!raw) return;

      const data = JSON.parse(raw);
      document.getElementById('p_problem').value = data.problem || '';
      document.getElementById('p_target').value = data.target || '';
      document.getElementById('p_goal').value = data.goal || '';
      document.getElementById('p_name').value = data.name || '';
      document.getElementById('p_features').value = data.features || '';
      document.getElementById('p_prompt').value = data.prompt || '';

      if (data.html) {
        currentHtmlCode = data.html;
        codeHistory = data.history || [data.html];
        document.getElementById('previewFrame').srcdoc = currentHtmlCode;
        document.getElementById('codeDisplayArea').value = currentHtmlCode;
        document.getElementById('statusTag').innerText = "이전 작업 복원됨";
      }

      if (data.chat && data.chat.length > 0) {
        chatLog = data.chat;
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        chatLog.forEach(m => {
          chatBox.innerHTML += `<div class="msg ${m.role === 'user' ? 'user' : 'ai'}">${m.content}</div>`;
        });
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function resetAllData() {
      if (!confirm('작성 중인 기획서와 생성된 웹앱을 모두 지우고 처음부터 다시 시작할까요?')) return;

      document.getElementById('p_problem').value = '';
      document.getElementById('p_target').value = '';
      document.getElementById('p_goal').value = '';
      document.getElementById('p_name').value = '';
      document.getElementById('p_features').value = '';
      document.getElementById('p_prompt').value = '';

      currentHtmlCode = '';
      codeHistory = [];
      chatLog = [];

      document.getElementById('previewFrame').srcdoc = '';
      document.getElementById('codeDisplayArea').value = '';
      document.getElementById('chatBox').innerHTML = `<div class="msg system">💡 전체 내용이 초기화되었습니다. 기획서를 다시 작성해 보세요.</div>`;
      document.getElementById('statusTag').innerText = "초기화됨";

      saveCurrentState();
      switchTab('plan');
    }

    function rollbackToPreviousVersion() {
      if (codeHistory.length <= 1) {
        alert('되돌릴 이전 정상 버전이 없습니다.');
        return;
      }

      codeHistory.pop();
      const prevHtml = codeHistory[codeHistory.length - 1];
      currentHtmlCode = prevHtml;

      document.getElementById('previewFrame').srcdoc = prevHtml;
      document.getElementById('codeDisplayArea').value = prevHtml;

      const chatBox = document.getElementById('chatBox');
      const rollbackMsg = `⏪ <b>이전 정상 작동 버전으로 복원되었습니다!</b> 우측 화면을 확인해 보세요.`;
      chatBox.innerHTML += `<div class="msg ai" style="border-color: #D97757;">${rollbackMsg}</div>`;
      chatLog.push({ role: "ai", content: rollbackMsg });
      chatBox.scrollTop = chatBox.scrollHeight;

      saveCurrentState();
    }

    function switchTab(tab) {
      document.getElementById('tabPlanBtn').classList.toggle('active', tab === 'plan');
      document.getElementById('tabChatBtn').classList.toggle('active', tab === 'chat');
      document.getElementById('tabCodeBtn').classList.toggle('active', tab === 'code');

      document.getElementById('planContent').classList.toggle('active', tab === 'plan');
      document.getElementById('chatContent').classList.toggle('active', tab === 'chat');
      document.getElementById('codeContent').classList.toggle('active', tab === 'code');
    }

    function extractPureHtml(rawText) {
      if (!rawText) return '';
      let clean = rawText.replace(/^```html\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '').trim();

      const docTypeIndex = clean.toLowerCase().indexOf('<!doctype html>');
      if (docTypeIndex !== -1) {
        clean = clean.substring(docTypeIndex);
      } else {
        const htmlIndex = clean.toLowerCase().indexOf('<html');
        if (htmlIndex !== -1) clean = '<!DOCTYPE html>\n' + clean.substring(htmlIndex);
      }

      const htmlCloseIndex = clean.toLowerCase().lastIndexOf('</html>');
      if (htmlCloseIndex !== -1) clean = clean.substring(0, htmlCloseIndex + 7);

      return clean;
    }

    async function generateFromPlan() {
      const problem = document.getElementById('p_problem').value.trim();
      const target = document.getElementById('p_target').value.trim();
      const goal = document.getElementById('p_goal').value.trim();
      const name = document.getElementById('p_name').value.trim();
      const features = document.getElementById('p_features').value.trim();
      const prompt = document.getElementById('p_prompt').value.trim();

      if (!problem || !name || !features || !prompt) {
        alert('필수 입력 항목을 모두 채워주세요.');
        return;
      }

      const promptPayload = `[앱 이름]: ${name}\n[사용자]: ${target}\n[해결 문제]: ${problem}\n[목표]: ${goal}\n[기능]: ${features}\n[요청사항]: ${prompt}\n\n모든 HTML 태그를 온전하게 작성하고 버튼 클릭 시 화면 데이터가 즉시 바뀌도록 JavaScript를 완성해서 작성해줘.`;

      switchTab('chat');
      const userMsgHtml = `<b>📋 기획서 제출: [${escapeHtml(name)}]</b><br>${escapeHtml(prompt)}`;
      document.getElementById('chatBox').innerHTML += `<div class="msg user">${userMsgHtml}</div>`;
      chatLog.push({ role: "user", content: userMsgHtml });
      
      const messages = [{ role: "user", content: promptPayload }];
      await sendToBackend(messages);
    }

    async function sendRefinement() {
      const input = document.getElementById('refineInput');
      const text = input.value.trim();
      if (!text) return;

      const userMsgHtml = `<b>수정 요청:</b> ${escapeHtml(text)}`;
      document.getElementById('chatBox').innerHTML += `<div class="msg user">${userMsgHtml}</div>`;
      chatLog.push({ role: "user", content: userMsgHtml });
      input.value = '';
      document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

      const messages = [
        { role: "assistant", content: currentHtmlCode },
        { role: "user", content: `기존 코드의 구조를 유지하면서 다음 내용을 반영해 전체 HTML 코드를 완성해줘: ${text}` }
      ];

      await sendToBackend(messages);
    }

    document.getElementById('refineInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendRefinement();
      }
    });

    async function sendToBackend(messages) {
      const statusTag = document.getElementById('statusTag');
      const buildBtn = document.getElementById('buildBtn');
      const refineBtn = document.getElementById('refineBtn');
      const chatBox = document.getElementById('chatBox');

      let elapsed = 0;
      statusTag.innerText = `생성 중... (0초)`;
      statusTag.className = "status-indicator running";
      buildBtn.disabled = true;
      refineBtn.disabled = true;

      timerInterval = setInterval(() => {
        elapsed++;
        statusTag.innerText = `AI 코딩 중... (${elapsed}초)`;
      }, 1000);

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        const data = await res.json();
        
        if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

        if (data.html) {
          const cleanHtml = extractPureHtml(data.html);
          currentHtmlCode = cleanHtml;
          
          codeHistory.push(cleanHtml);
          if (codeHistory.length > 10) codeHistory.shift();

          document.getElementById('previewFrame').srcdoc = cleanHtml;
          document.getElementById('codeDisplayArea').value = cleanHtml;

          const aiMsg = `✅ 프로토타입 생성/수정 완료 (${elapsed}초 소요)<br>우측 화면에서 기능을 확인하거나 <b>[3. 코드 복사]</b> 탭에서 코드를 복사하세요. 혹시 버튼이 먹통이면 <b>[⏪ 이전 정상 버전 복원]</b>을 누르세요.`;
          chatBox.innerHTML += `<div class="msg ai">${aiMsg}</div>`;
          chatLog.push({ role: "ai", content: aiMsg });

          saveCurrentState();
        }
      } catch (err) {
        const errMsg = `⚠️ 오류 발생: ${escapeHtml(err.message)}`;
        chatBox.innerHTML += `<div class="msg ai" style="color: #D97757;">${errMsg}</div>`;
        chatLog.push({ role: "ai", content: errMsg });
      } finally {
        clearInterval(timerInterval);
        statusTag.innerText = "동작 준비 완료";
        statusTag.className = "status-indicator";
        buildBtn.disabled = false;
        refineBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function copyCodeToClipboard() {
      if (!currentHtmlCode) return alert('먼저 프로토타입을 생성해 주세요.');
      navigator.clipboard.writeText(currentHtmlCode).then(() => {
        alert('전체 코드가 클립보드에 복사되었습니다! 기획서나 보고서에 붙여넣기(Ctrl+V) 하세요.');
      });
    }

    function downloadHtmlFile() {
      if (!currentHtmlCode) return alert('먼저 프로토타입을 생성해 주세요.');
      const blob = new Blob([currentHtmlCode], { type: 'text/html;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${currentUser || 'student'}_app.html`;
      link.click();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
