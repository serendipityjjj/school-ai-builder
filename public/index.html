<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 웹앱 개발 실습 및 기획 빌더</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #FAF9F5;
      color: #141413;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .serif { font-family: 'Noto Serif KR', Georgia, serif; }
    header {
      height: 60px;
      border-bottom: 1px solid #C6C4BA;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #FAF9F5;
      flex-shrink: 0;
    }
    .badge {
      background-color: #E3DACC;
      color: #141413;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 480px 1fr;
      gap: 24px;
      max-width: 1700px;
      width: 100%;
      margin: 0 auto;
      height: calc(100vh - 60px);
      padding: 20px 32px;
    }
    .left-panel {
      background: #FAF9F5;
      border: 1px solid #C6C4BA;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .tab-bar {
      display: flex;
      border-bottom: 1px solid #C6C4BA;
      background-color: #E3DACC;
      flex-shrink: 0;
    }
    .tab-btn {
      flex: 1;
      padding: 12px 10px;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 600;
      color: #73726C;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab-btn.active {
      color: #141413;
      border-bottom: 2px solid #D97757;
      background-color: #FAF9F5;
    }
    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: none;
    }
    .tab-content.active {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-section-title {
      font-size: 13px;
      font-weight: 700;
      color: #D97757;
      margin-top: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #E3DACC;
    }
    label { font-size: 12px; font-weight: 600; color: #141413; }
    input[type="text"], textarea {
      width: 100%;
      background: #FAF9F5;
      border: 1px solid #C6C4BA;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
      color: #141413;
      outline: none;
    }
    input[type="text"]:focus, textarea:focus { border-color: #D97757; }
    textarea { resize: vertical; }
    .btn-primary {
      background-color: #141413;
      color: #FAF9F5;
      border: 1px solid #141413;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-primary:hover { background-color: #0F0F0E; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .btn-secondary {
      background-color: #FAF9F5;
      color: #141413;
      border: 1px solid #C6C4BA;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      border-color: #141413;
      background-color: #E3DACC;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      max-width: 92%;
      word-break: break-word;
    }
    .msg.system { background-color: #E3DACC; border: 1px solid #C6C4BA; }
    .msg.user { background-color: #141413; color: #FAF9F5; align-self: flex-end; }
    .msg.ai { background-color: #FAF9F5; border: 1px solid #C6C4BA; align-self: flex-start; }
    .refine-box {
      border-top: 1px solid #C6C4BA;
      padding-top: 12px;
      display: flex;
      gap: 8px;
    }

    /* Code View Area */
    .code-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .code-viewer {
      flex: 1;
      width: 100%;
      background-color: #141413;
      color: #FAF9F5;
      border-radius: 6px;
      padding: 14px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 12px;
      line-height: 1.5;
      border: none;
      resize: none;
      outline: none;
      white-space: pre;
    }

    .preview-panel {
      background: #FAF9F5;
      border: 1px solid #C6C4BA;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .preview-bar {
      padding: 12px 20px;
      border-bottom: 1px solid #C6C4BA;
      background-color: #E3DACC;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .status-indicator {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 4px;
      background-color: #C6C4BA;
      font-weight: 600;
    }
    .status-indicator.running { background-color: #D97757; color: #FAF9F5; }
    iframe { flex: 1; width: 100%; height: 100%; border: none; background-color: #FFFFFF; }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 12px;">
      <h1 class="serif" style="font-size: 18px; font-weight: 700;">AI 웹앱 개발 수행평가 빌더</h1>
      <span class="badge">기획 ➔ 프로토타입 ➔ 코드 복사</span>
    </div>
    <div style="font-size: 13px; color: #73726C;">Upstage Solar Engine</div>
  </header>

  <main>
    <section class="left-panel">
      <!-- 3개 탭 구성 -->
      <nav class="tab-bar">
        <button id="tabPlanBtn" class="tab-btn active" onclick="switchTab('plan')">📝 1. 기획서</button>
        <button id="tabChatBtn" class="tab-btn" onclick="switchTab('chat')">🔄 2. 수정·개선</button>
        <button id="tabCodeBtn" class="tab-btn" onclick="switchTab('code')">💻 3. 코드 복사</button>
      </nav>

      <!-- 1. 기획서 탭 -->
      <div id="planContent" class="tab-content active">
        <div class="form-section-title">1. 문제 발견 및 정의</div>
        <div class="form-group">
          <label>일상 속 불편한 점 *</label>
          <input type="text" id="p_problem" placeholder="예: 매일 쓴 용돈을 메모하면 합계 계산이 안 됨">
        </div>
        <div class="form-group">
          <label>사용자 (Target User) *</label>
          <input type="text" id="p_target" placeholder="예: 용돈을 아껴 쓰고 싶은 학생">
        </div>
        <div class="form-group">
          <label>해결 목표 *</label>
          <input type="text" id="p_goal" placeholder="예: 지출 입력 즉시 잔여 예산과 총액을 계산해 보여줌">
        </div>

        <div class="form-section-title">2. 웹앱 개요 및 기능 설계</div>
        <div class="form-group">
          <label>웹앱 이름 *</label>
          <input type="text" id="p_name" placeholder="예: 내 돈을 지켜라">
        </div>
        <div class="form-group">
          <label>주요 기능 목록 *</label>
          <textarea id="p_features" rows="2" placeholder="1) 예산 설정 및 잔여 예산 계산 2) 금액 추가 버튼(+1000원 등) 클릭 시 즉시 차감 3) 지출 내역 표시"></textarea>
        </div>

        <div class="form-section-title">3. 최초 AI 생성 요청문</div>
        <div class="form-group">
          <label>프롬프트 *</label>
          <textarea id="p_prompt" rows="2" placeholder="예: 상단에 예산과 잔액이 보이고, 간편 금액 추가 버튼을 누르면 잔액이 바로 차감되는 가계부 앱을 만들어줘."></textarea>
        </div>

        <button id="buildBtn" class="btn-primary" onclick="generateFromPlan()">🚀 프로토타입 생성하기</button>
      </div>

      <!-- 2. 대화 탭 -->
      <div id="chatContent" class="tab-content">
        <div id="chatBox" class="chat-messages">
          <div class="msg system">
            💡 프로토타입을 테스트해보고, 수정하고 싶은 부분을 아래에 입력해 주세요.
          </div>
        </div>
        
        <div class="refine-box">
          <textarea id="refineInput" rows="2" placeholder="수정 요청사항 입력 (Enter 전송)..."></textarea>
          <button id="refineBtn" class="btn-primary" style="padding: 0 16px;" onclick="sendRefinement()">수정</button>
        </div>
      </div>

      <!-- 3. 코드 복사 탭 -->
      <div id="codeContent" class="tab-content">
        <div class="code-toolbar">
          <button class="btn-secondary" onclick="copyCodeToClipboard()">📋 전체 코드 복사</button>
          <button class="btn-secondary" onclick="downloadHtmlFile()">💾 HTML 파일 다운로드</button>
        </div>
        <textarea id="codeDisplayArea" class="code-viewer" readonly placeholder="프로토타입이 생성되면 여기에 전체 HTML 코드가 표시됩니다."></textarea>
      </div>
    </section>

    <!-- 우측 미리보기 -->
    <section class="preview-panel">
      <div class="preview-bar">
        <span class="serif" style="font-weight: 600; font-size: 14px;">🖥️ 실시간 프로토타입 화면</span>
        <span id="statusTag" class="status-indicator">작성 대기 중</span>
      </div>
      <iframe id="previewFrame" sandbox="allow-scripts allow-forms allow-modals allow-same-origin"></iframe>
    </section>
  </main>

  <script>
    let currentHtmlCode = "";
    let timerInterval = null;

    function switchTab(tab) {
      document.getElementById('tabPlanBtn').classList.toggle('active', tab === 'plan');
      document.getElementById('tabChatBtn').classList.toggle('active', tab === 'chat');
      document.getElementById('tabCodeBtn').classList.toggle('active', tab === 'code');

      document.getElementById('planContent').classList.toggle('active', tab === 'plan');
      document.getElementById('chatContent').classList.toggle('active', tab === 'chat');
      document.getElementById('codeContent').classList.toggle('active', tab === 'code');
    }

    function extractPureHtml(rawText) {
      if (!rawText) return '';
      let clean = rawText;
      clean = clean.replace(/^```html\s*/i, '').replace(/^```\s*/i, '').replace(/```\s*$/i, '').trim();

      const docTypeIndex = clean.toLowerCase().indexOf('<!doctype html>');
      if (docTypeIndex !== -1) {
        clean = clean.substring(docTypeIndex);
      } else {
        const htmlIndex = clean.toLowerCase().indexOf('<html');
        if (htmlIndex !== -1) {
          clean = '<!DOCTYPE html>\n' + clean.substring(htmlIndex);
        }
      }

      const htmlCloseIndex = clean.toLowerCase().lastIndexOf('</html>');
      if (htmlCloseIndex !== -1) {
        clean = clean.substring(0, htmlCloseIndex + 7);
      }

      return clean;
    }

    async function generateFromPlan() {
      const problem = document.getElementById('p_problem').value.trim();
      const target = document.getElementById('p_target').value.trim();
      const goal = document.getElementById('p_goal').value.trim();
      const name = document.getElementById('p_name').value.trim();
      const features = document.getElementById('p_features').value.trim();
      const prompt = document.getElementById('p_prompt').value.trim();

      if (!problem || !name || !features || !prompt) {
        alert('필수 입력 항목을 모두 채워주세요.');
        return;
      }

      const promptPayload = `[앱 이름]: ${name}\n[사용자]: ${target}\n[해결 문제]: ${problem}\n[목표]: ${goal}\n[기능]: ${features}\n[요청사항]: ${prompt}\n\n모든 HTML 태그를 온전하게 작성하고 버튼 클릭 시 화면 데이터가 즉시 바뀌도록 JavaScript를 완성해서 작성해줘.`;

      switchTab('chat');
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML += `<div class="msg user"><b>📋 기획서 제출: [${escapeHtml(name)}]</b><br>${escapeHtml(prompt)}</div>`;
      
      const messages = [{ role: "user", content: promptPayload }];
      await sendToBackend(messages);
    }

    async function sendRefinement() {
      const input = document.getElementById('refineInput');
      const text = input.value.trim();
      if (!text) return;

      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML += `<div class="msg user"><b>수정 요청:</b> ${escapeHtml(text)}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const messages = [
        { role: "assistant", content: currentHtmlCode },
        { role: "user", content: `기존 코드의 구조를 유지하면서 다음 내용을 반영해 전체 HTML 코드를 완성해줘: ${text}` }
      ];

      await sendToBackend(messages);
    }

    document.getElementById('refineInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendRefinement();
      }
    });

    async function sendToBackend(messages) {
      const statusTag = document.getElementById('statusTag');
      const buildBtn = document.getElementById('buildBtn');
      const refineBtn = document.getElementById('refineBtn');
      const chatBox = document.getElementById('chatBox');

      let elapsed = 0;
      statusTag.innerText = `생성 중... (0초)`;
      statusTag.className = "status-indicator running";
      buildBtn.disabled = true;
      refineBtn.disabled = true;

      timerInterval = setInterval(() => {
        elapsed++;
        statusTag.innerText = `AI 코딩 중... (${elapsed}초)`;
      }, 1000);

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages })
        });

        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.error || `HTTP ${res.status}`);
        }

        if (data.html) {
          const cleanHtml = extractPureHtml(data.html);
          currentHtmlCode = cleanHtml;
          
          // 1. iframe 렌더링
          document.getElementById('previewFrame').srcdoc = cleanHtml;
          
          // 2. 3단계 코드 뷰어에 최신 코드 동기화
          document.getElementById('codeDisplayArea').value = cleanHtml;

          chatBox.innerHTML += `<div class="msg ai">✅ 프로토타입 생성이 완료되었습니다! (${elapsed}초 소요)<br>우측 화면에서 기능을 확인하거나, <b>[3. 코드 복사]</b> 탭에서 코드를 복사하세요.</div>`;
        }
      } catch (err) {
        chatBox.innerHTML += `<div class="msg ai" style="color: #D97757;">⚠️ 오류: ${escapeHtml(err.message)}</div>`;
      } finally {
        clearInterval(timerInterval);
        statusTag.innerText = "동작 준비 완료";
        statusTag.className = "status-indicator";
        buildBtn.disabled = false;
        refineBtn.disabled = false;
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    // 📋 전체 코드 클립보드 복사
    function copyCodeToClipboard() {
      if (!currentHtmlCode) {
        alert('먼저 프로토타입을 생성해 주세요.');
        return;
      }
      navigator.clipboard.writeText(currentHtmlCode).then(() => {
        alert('전체 코드가 클립보드에 복사되었습니다! 기획서나 보고서에 붙여넣기(Ctrl+V) 하세요.');
      }).catch(err => {
        const textarea = document.getElementById('codeDisplayArea');
        textarea.select();
        document.execCommand('copy');
        alert('전체 코드가 복사되었습니다!');
      });
    }

    // 💾 HTML 파일로 다운로드
    function downloadHtmlFile() {
      if (!currentHtmlCode) {
        alert('먼저 프로토타입을 생성해 주세요.');
        return;
      }
      const blob = new Blob([currentHtmlCode], { type: 'text/html;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'prototype_app.html';
      link.click();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
